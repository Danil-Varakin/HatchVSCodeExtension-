name: ci

# Two cores, as VERSIONING.md asks of a client (R8): the RELEASED one the manifest names —
# what a user gets — and the core's `dev`, so a contract change there is seen here before it
# is released. Then the package itself: built once and run from the installed .vsix.
#
# The end-to-end suite runs on Linux and Windows, not on macOS. It is not about macOS: the
# suite drives the editor through its active editor, and the extension host is told which
# editor is active only while the WINDOW HAS FOCUS. A macOS runner has no focused window —
# `window.tabGroups` shows the right tab in the right group, while `activeTextEditor` keeps
# naming the old one and `onDidChangeActiveTextEditor` never fires — so every check around a
# jump, the status bar or the guard would be measuring the runner, not the extension. The
# Linux (under xvfb) and Windows runners do have the focus. macOS keeps the unit tests here,
# the suite is run on it by hand before a release, and that run is a developer's window.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      core:
        description: 'hatchTs revision for the dev cell (branch, tag or commit)'
        default: dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CORE_REF: ${{ inputs.core || 'dev' }}

jobs:
  test:
    name: ${{ matrix.core }} core, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        core: [release, dev]
    defaults:
      run:
        working-directory: HatchVSCodeExtension-

    steps:
      - uses: actions/checkout@v4
        with:
          path: HatchVSCodeExtension-
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # the release cell takes the core from package.json — the tarball of its GitHub release
      - name: install
        run: npm ci

      - uses: actions/checkout@v4
        if: matrix.core == 'dev'
        with:
          repository: Danil-Varakin/hatchTs
          ref: ${{ env.CORE_REF }}
          path: HatchTS
      - name: the core from its checkout, in place of the release
        if: matrix.core == 'dev'
        working-directory: HatchTS
        run: |
          npm ci
          npm run grammars
          npm run build
      - name: link it
        if: matrix.core == 'dev'
        run: npm install --no-save ../HatchTS

      - name: typecheck and unit tests
        run: npm run check

      - name: VS Code for the end-to-end tests
        if: runner.os != 'macOS'
        uses: actions/cache@v4
        with:
          path: HatchVSCodeExtension-/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('HatchVSCodeExtension-/package-lock.json') }}

      - name: end-to-end tests (Linux, under a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
        env:
          # the editor's profile, short: it holds a unix socket, and the checkout is deep
          HATCH_TEST_USER_DATA: ${{ runner.temp }}/vsc
      - name: end-to-end tests
        if: runner.os == 'Windows'
        run: npm run test:e2e
        env:
          # the editor's profile, short: it holds a unix socket, and the checkout is deep
          HATCH_TEST_USER_DATA: ${{ runner.temp }}/vsc

  package:
    name: .vsix
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the released core, as the package will carry it; `package` checks the listing
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
          if-no-files-found: error

  packaged:
    name: the .vsix on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: package
    strategy:
      fail-fast: false
      # the suite runs where the window has focus — see the note at the top
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      - name: VS Code for the end-to-end tests
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # installs the .vsix into a throwaway profile and runs the whole suite inside it
      - name: the suite against the installed package (Linux, under a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:packaged
        env:
          # the editor's profile, short: it holds a unix socket, and the checkout is deep
          HATCH_TEST_USER_DATA: ${{ runner.temp }}/vsc
      - name: the suite against the installed package
        if: runner.os == 'Windows'
        run: npm run test:packaged
        env:
          # the editor's profile, short: it holds a unix socket, and the checkout is deep
          HATCH_TEST_USER_DATA: ${{ runner.temp }}/vsc
